
# Loki em modo SingleBinary para o cluster EKS (nodes t3.small).
# Armazenamento em filesystem SEM PVC: os logs somem se o pod reiniciar.
# Aceitável para a demonstração do Tech Challenge.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Necessário para receber logs via OTLP (atributos do OTel)
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Desliga os modos distribuídos
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Desliga componentes pesados/desnecessários para a demo
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

# Gateway (nginx) expõe o Loki e o endpoint OTLP em /otlp
gateway:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
