apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # O chart do Loki foi movido para o repositório grafana-community
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: "18.5.2"
      helm:
        valueFiles:
          - $values/helm-values/observability/loki.yaml
    - repoURL: https://github.com/RickeMelo/tech-challenge-3-k8s-staging.git
      targetRevision: feature/fase-4-observabilidade
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
